<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="brand">
        <h1>🤝 SignBridge</h1>
        <span class="version">v1.0.0</span>
      </div>
      <p class="tagline">Hand Gesture Detection</p>
    </header>

    <div class="status-section">
      <div class="status-indicator">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Stopped</span>
      </div>
    </div>

    <div class="controls">
      <button id="toggleBtn" class="primary-btn">Start</button>
    </div>

    <div class="info-section">
      <h3>Supported Platforms:</h3>
      <div class="supported-tags">
        <span class="tag">Google Meet</span>
        <span class="tag">Zoom</span>
        <span class="tag">MS Teams</span>
        <span class="tag">Webex</span>
        <span class="tag">Jitsi</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
